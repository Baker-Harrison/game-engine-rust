[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Agent-first game engine. Zero external crates, std only."

[workspace]
members = [".", "games/*"]

[dependencies]
# Intentionally empty. This engine uses only the Rust standard library.

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
