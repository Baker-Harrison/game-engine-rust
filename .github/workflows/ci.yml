name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software driver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --release --workspace
      - name: Headless render
        run: cargo run --release -- render --out frame.ppm
      # Opens a real window for 30 frames on the main thread (AppKit requires the main thread,
      # which is why this is not a cargo test).
      - name: Window smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --release -- run --frames 30
      - name: Window smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        run: cargo run --release -- run --frames 30
      - name: Inspect assets
        run: |
          cargo run --release -- inspect chair --out inspect/chair
          cargo run --release -- inspect carbine --out inspect/carbine
          cargo run --release -- inspect house furniture_cell=0.012 --out inspect/house
      - name: Render a scene that places an asset
        run: cargo run --release -- render scenes/showroom.scene --out showroom.ppm
      - name: Sample game layout check gate
        run: cargo run --release -p oilyard -- check
      - name: Sample game headless simulation
        run: cargo run --release -p oilyard -- sim --ticks 900 --seed 3
      - name: Sample game frame capture
        run: cargo run --release -p oilyard -- shot --out oilyard.png --ticks 120 --width 640 --height 360
      - name: Sample game window smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --release -p oilyard -- play --frames 30 --no-audio
      - name: Sample game window smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        run: cargo run --release -p oilyard -- play --frames 30 --no-audio
